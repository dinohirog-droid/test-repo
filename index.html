<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cyber Knight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(12, 20, 36, 0.78);
      --line: rgba(110, 180, 255, 0.22);
      --text: #dbe6f5;
      --dim: #8a9bb6;
      --accent: #3aa8ff;
      --hot: #ffa53a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 13px; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .panel { position: fixed; top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 14px 16px; backdrop-filter: blur(8px); width: 260px; max-height: calc(100% - 32px); overflow: auto; }
    #left { left: 16px; }
    #right { right: 16px; }
    h1 { font-family: Orbitron, sans-serif; font-size: 22px; letter-spacing: 0.08em; margin: 0; color: #eaf3ff; }
    .sub { color: var(--accent); margin: 2px 0 10px; letter-spacing: 0.1em; }
    h2 { font-size: 12px; color: var(--dim); font-weight: 600; margin: 14px 0 6px; letter-spacing: 0.05em; }
    h2::before { content: "■ "; color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .grid.four { grid-template-columns: repeat(4, 1fr); }
    .grid.four button { padding: 6px 2px; font-size: 12px; }
    button { font: inherit; color: var(--text); background: rgba(40, 70, 120, 0.35); border: 1px solid var(--line);
      border-radius: 6px; padding: 7px 8px; cursor: pointer; transition: background .15s, border-color .15s; }
    button:hover { background: rgba(58, 168, 255, 0.25); border-color: var(--accent); }
    button.on { background: rgba(58, 168, 255, 0.4); border-color: var(--accent); color: #fff; }
    button.action { border-color: rgba(58, 168, 255, 0.55); }
    #variants button { display: flex; align-items: center; gap: 6px; }
    #variants button::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--sw);
      border: 1px solid rgba(255,255,255,0.3); }
    label.tg { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
    label.tg input { accent-color: var(--accent); }
    select { width: 100%; font: inherit; color: var(--text); background: #0d1626; border: 1px solid var(--line);
      border-radius: 6px; padding: 6px; }
    .ax { display: grid; grid-template-columns: 64px 1fr 36px; align-items: center; gap: 8px; margin: 8px 0; }
    .ax span { color: var(--dim); font-size: 12px; }
    .ax output { text-align: right; font-variant-numeric: tabular-nums; }
    .ax input { width: 100%; accent-color: var(--hot); }
    .ax output:empty { display: none; }
    .note { color: var(--dim); font-size: 11.5px; line-height: 1.5; margin: 6px 0 0; }
    #ik-note { color: var(--hot); }
    #panel-toggle { position: fixed; bottom: 16px; right: 16px; display: none; }
    .hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); color: var(--dim); font-size: 11.5px;
      pointer-events: none; white-space: nowrap; }
    @media (max-width: 760px) {
      .panel { width: auto; left: 16px !important; right: 16px !important; top: auto; max-height: 38vh; }
      #left { bottom: 16px; }
      #right { display: none; }
      body.collapsed #left { display: none; }
      body.editor #left { display: none; }
      body.editor #right { display: block; bottom: 16px; }
      #panel-toggle { display: block; bottom: auto; top: 16px; }
      .hint { display: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div class="panel" id="left">
    <h1>CYBER KNIGHT</h1>
    <div class="sub">サイバーナイト</div>

    <h2>モーション</h2>
    <div class="grid" id="modes"></div>

    <h2>アクション</h2>
    <div class="grid" id="actions"></div>

    <h2>カラーバリエーション</h2>
    <div class="grid" id="variants"></div>

    <h2>手首パーツ(右手)</h2>
    <div class="grid four" id="hand-R"></div>
    <h2>手首パーツ(左手)</h2>
    <div class="grid four" id="hand-L"></div>

    <h2>武装</h2>
    <label class="tg"><input type="checkbox" id="eq-sword" /> エネルギーソード(右手)</label>
    <label class="tg"><input type="checkbox" id="eq-shield" /> エネルギーシールド(左手)</label>
    <div class="ax"><span>盾の間隔</span><input type="range" id="clearance" min="3" max="20" step="0.5" /><output id="clearance-out"></output></div>

    <h2>サイバーホース</h2>
    <label class="tg"><input type="checkbox" id="ride" /> 乗車する</label>
    <div class="ax"><span>速度</span><input type="range" id="speed" min="0" max="40" step="1" value="0" /><output id="speed-out"></output></div>
    <div class="ax"><span>ハンドル</span><input type="range" id="steer" min="-30" max="30" step="1" value="0" /><output id="steer-out"></output></div>
    <label class="tg"><input type="checkbox" id="boost" /> リアスラスター噴射</label>

    <h2>外観</h2>
    <label class="tg"><input type="checkbox" id="outline-on" /> 輪郭線</label>
    <div class="ax"><span>線の太さ</span><input type="range" id="outline-w" min="1" max="8" step="0.25" /><output></output></div>

    <h2>表示・機能</h2>
    <label class="tg"><input type="checkbox" data-toggle="markers" /> 関節マーカー(クリックで選択)</label>
    <label class="tg"><input type="checkbox" data-toggle="ik" checked /> 脚 IK(足を接地させる)</label>
    <label class="tg"><input type="checkbox" data-toggle="physics" checked /> マント・羽飾りの物理</label>
    <label class="tg"><input type="checkbox" data-toggle="look" checked /> カメラ目線</label>
    <label class="tg"><input type="checkbox" data-toggle="pulse" checked /> 発光の点滅</label>
    <label class="tg"><input type="checkbox" data-toggle="spin" /> カメラ自動回転</label>
  </div>

  <div class="panel" id="right">
    <h2 style="margin-top:0">関節エディタ</h2>
    <select id="joint"></select>
    <div class="ax" id="ax-x"><span>X</span><input type="range" /><output></output></div>
    <div class="ax" id="ax-y"><span>Y</span><input type="range" /><output></output></div>
    <div class="ax" id="ax-z"><span>Z</span><input type="range" /><output></output></div>
    <p class="note" id="range"></p>
    <p class="note" id="ik-note" hidden>脚 IK が有効なため、脚の関節は自動で計算されます。手で動かすには脚 IK をオフにしてください。</p>
    <p style="margin-top:10px"><button id="reset-joint">この関節をリセット</button></p>
    <p class="note">スライダーを動かすと、その時点のポーズを保持して編集します。肩アーマー・草摺・前垂れは関節の動きに連動します。</p>
  </div>

  <button id="panel-toggle">パネル</button>
  <div class="hint">ドラッグで回転 ・ ホイールでズーム ・ 右ドラッグで移動</div>

  <script src="./cyber-knight-model.js"></script>
  <script src="./cyber-horse-model.js"></script>
  <!-- ビューア本体。ファイルを直接開いても(file://)動くよう、外部モジュールにせずここに埋め込む -->
  <script type="module">
// Cyber Knight Studio: cyber-knight-model.js を読み込んで表示・操作するビューア
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Model = window.CyberKnightModel;

// ---------- レンダラ / シーン ----------
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b14);
scene.fog = new THREE.Fog(0x070b14, 7, 18);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
camera.position.set(2.3, 1.55, 3.8);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.minDistance = 0.6;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.53;
controls.autoRotateSpeed = 0.8;

scene.add(new THREE.HemisphereLight(0x9fb8ff, 0x101018, 0.25));
const key = new THREE.DirectionalLight(0xfff4e8, 1.6);
key.position.set(3, 5, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.2, right: 2.2, top: 2.2, bottom: -2.2 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight(0x4aa8ff, 2.2);
rim.position.set(-3, 3, -4);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffd9a8, 0.6);
fill.position.set(-4, 2, 3);
scene.add(fill);

const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 64), new THREE.MeshStandardMaterial({ color: 0x0b111c, roughness: 0.7, metalness: 0.2 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
for (const [r, o] of [[1.2, 0.5], [1.26, 0.25], [2.4, 0.15]]) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.012, 128), new THREE.MeshBasicMaterial({ color: 0x2fa4ff, transparent: true, opacity: o, toneMapped: false }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.002;
  scene.add(ring);
}
const grid = new THREE.GridHelper(12, 48, 0x15223a, 0x0e1626);
grid.position.y = 0.001;
scene.add(grid);

const sparkGeo = new THREE.BufferGeometry();
const sparkPos = new Float32Array(260 * 3);
for (let i = 0; i < 260; i++) sparkPos.set([(Math.random() - 0.5) * 7, Math.random() * 3.5, (Math.random() - 0.5) * 7], i * 3);
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
scene.add(new THREE.Points(sparkGeo, new THREE.PointsMaterial({ color: 0x6cc6ff, size: 0.018, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false })));

// ---------- ナイト ----------
// モデルはセリナと同じ世界の縮尺(既定 2.4)で作り、表示用にメートルへ縮める
const world = new THREE.Group();
world.scale.setScalar(1 / 2.4);
scene.add(world);
const K = Model.create(THREE, world);
const H = window.CyberHorseModel.create(THREE, world);
H.root.visible = false;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.7, 0.5, 3.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  // 縦長画面では画角を広げ、下部パネルの分だけ画面を上にずらす
  camera.fov = camera.aspect < 1 ? Math.min(62, 26 / camera.aspect) : 32;
  if (w <= 760) camera.setViewOffset(w, h, 0, h * 0.2, w, h);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);
resize();

// ---------- UI ----------
const $ = (s) => document.querySelector(s);
function button(parent, label, onClick, cls = '') {
  const b = document.createElement('button');
  b.textContent = label;
  b.className = cls;
  b.addEventListener('click', onClick);
  $(parent).appendChild(b);
  return b;
}
const group = (sel, b) => document.querySelectorAll(`${sel} button`).forEach((x) => x.classList.toggle('on', x === b));

const MODE_LABELS = { idle: '待機', guard: '構え', block: '防御', visor: '素顔', walk: '歩く', run: '走る' };
const ACTION_LABELS = { spin: '回転斬り', charge: '突進' };
const modeBtns = {};
const pickMode = (m) => { if (K.isRiding()) setRide(false); K.setMode(m); };
for (const [m, label] of Object.entries(MODE_LABELS)) modeBtns[m] = button('#modes', label, () => pickMode(m));
for (const [m, label] of Object.entries(ACTION_LABELS)) modeBtns[m] = button('#actions', label, () => pickMode(m), 'action');

// 乗車・走行
const rideCb = $('#ride'), speedEl = $('#speed'), steerEl = $('#steer'), boostCb = $('#boost');
function setRide(on) {
  rideCb.checked = on;
  H.root.visible = on;
  H.setStand(on ? 0 : 1);
  if (on) K.ride(H); else K.dismount();
  syncEquip();
}
rideCb.addEventListener('change', () => setRide(rideCb.checked));
boostCb.addEventListener('change', () => H.setBoost(boostCb.checked ? 1 : 0));
const bikeOut = () => {
  $('#speed-out').textContent = `${Math.round(speedEl.value * 3.6)} km/h`;
  $('#steer-out').textContent = `${steerEl.value}°`;
};
speedEl.addEventListener('input', bikeOut);
steerEl.addEventListener('input', bikeOut);
bikeOut();

for (const [k, v] of Object.entries(K.COLORS)) {
  const b = button('#variants', v.label, () => { K.setColor(k); group('#variants', b); });
  b.style.setProperty('--sw', `#${new THREE.Color(v.paint).getHexString()}`);
  if (k === K.getColor()) b.classList.add('on');
}

// 手の差し替え(握り手・持ち手・開き手)と装備
const HAND_LABELS = { grip: '持ち手', fist: '握り手', open: '開き手', relax: '自然' };
for (const s of ['R', 'L']) {
  for (const [h, label] of Object.entries(HAND_LABELS)) {
    button(`#hand-${s}`, label, () => { K.setHand(s, h === 'grip' ? null : h); syncEquip(); });
  }
}
const eqSword = $('#eq-sword'), eqShield = $('#eq-shield');
eqSword.addEventListener('change', () => { K.setEquip({ sword: eqSword.checked }); syncEquip(); });
eqShield.addEventListener('change', () => { K.setEquip({ shield: eqShield.checked }); syncEquip(); });
function syncEquip() {
  const e = K.getEquip();
  eqSword.checked = e.sword;
  eqShield.checked = e.shield;
  for (const s of ['R', 'L']) {
    const holding = s === 'R' ? e.sword : e.shield;
    const cur = holding ? 'grip' : K.getHand(s) || 'grip';
    document.querySelectorAll(`#hand-${s} button`).forEach((b, i) => b.classList.toggle('on', Object.keys(HAND_LABELS)[i] === cur));
  }
}
syncEquip();

const clr = $('#clearance');
clr.value = K.getShieldClearance() * 100;
$('#clearance-out').textContent = `${Math.round(clr.value)} cm`;
clr.addEventListener('input', () => {
  K.setShieldClearance(clr.value / 100);
  $('#clearance-out').textContent = `${Math.round(clr.value)} cm`;
});

const olOn = $('#outline-on'), olW = $('#outline-w');
olOn.checked = K.getOutline().on;
olW.value = K.getOutline().width * 1000;
olOn.addEventListener('change', () => K.setOutline(olOn.checked));
olW.addEventListener('input', () => K.setOutline(true, olW.value / 1000) || (olOn.checked = true));

let markersOn = false;
const toggles = {
  markers: (on) => { markersOn = on; K.markers.forEach((m) => (m.visible = on)); highlight(); },
  ik: (on) => { K.setIK(on); syncEditor(true); },
  physics: (on) => K.setPhysics(on),
  look: (on) => K.setLook(on),
  pulse: (on) => K.setGlowPulse(on),
  spin: (on) => (controls.autoRotate = on),
};
document.querySelectorAll('[data-toggle]').forEach((el) => el.addEventListener('change', () => toggles[el.dataset.toggle](el.checked)));

// 関節エディタ
const ui = { selected: 'shoulder_R' };
const sel = $('#joint');
sel.add(new Option('重心(腰の位置)', 'root'));
for (const j of K.JOINTS) sel.add(new Option(j.label, j.name));
sel.addEventListener('change', () => select(sel.value));
const sliders = ['x', 'y', 'z'].map((ax) => {
  const row = $(`#ax-${ax}`);
  const input = row.querySelector('input');
  input.addEventListener('input', () => {
    const v = parseFloat(input.value);
    if (ui.selected === 'root') K.editRoot(ax, v / 100);
    else K.editJoint(ui.selected, ax, v);
  });
  return { ax, row, input, out: row.querySelector('output') };
});
$('#reset-joint').addEventListener('click', () => {
  if (ui.selected === 'root') ['x', 'y', 'z'].forEach((a) => K.editRoot(a, 0));
  else ['x', 'y', 'z'].forEach((a) => K.editJoint(ui.selected, a, 0));
});
function select(name) {
  ui.selected = name;
  sel.value = name;
  highlight();
  syncEditor(true);
}
function highlight() {
  for (const m of K.markers) {
    const on = m.userData.joint === ui.selected;
    m.material.color.set(on ? 0xffa53a : 0x7fd8ff);
    m.scale.setScalar(on ? 1.5 : 1);
  }
}
const AX = { x: 'X 前後', y: 'Y ひねり', z: 'Z 左右' };
const AXR = { x: '左右 cm', y: '上下 cm', z: '前後 cm' };
const JL = Object.fromEntries(K.JOINTS.map((j) => [j.name, j]));
function syncEditor(full = false) {
  const n = ui.selected, isRoot = n === 'root', j = JL[n];
  const locked = !isRoot && K.getState().ik && K.isLeg(n);
  const P = K.getPose();
  $('#ik-note').hidden = !locked;
  for (const s of sliders) {
    const lim = isRoot ? (s.ax === 'y' ? [-35, 5] : [-25, 25]) : j.lim[s.ax];
    s.row.hidden = lim[0] === lim[1];
    if (s.row.hidden) continue;
    if (full) {
      Object.assign(s.input, { min: lim[0], max: lim[1], step: isRoot ? 0.5 : 1 });
      s.row.querySelector('span').textContent = isRoot ? AXR[s.ax] : AX[s.ax];
    }
    s.input.disabled = locked;
    const i = 'xyz'.indexOf(s.ax);
    const v = isRoot ? P.root[i] * 100 : P.j[n][i];
    if (document.activeElement !== s.input) s.input.value = v;
    s.out.textContent = `${Math.round(v)}`;
  }
  $('#range').textContent = isRoot
    ? '腰を下げると脚 IK が膝を曲げて接地を保ちます'
    : `可動域 ${['x', 'y', 'z'].filter((a) => j.lim[a][0] !== j.lim[a][1]).map((a) => `${a.toUpperCase()} ${j.lim[a][0]}〜${j.lim[a][1]}°`).join(' / ')}`;
}
select(ui.selected);

// クリックで関節を選択(マーカー表示中)
const ray = new THREE.Raycaster();
let down = null;
canvas.addEventListener('pointerdown', (e) => (down = [e.clientX, e.clientY]));
canvas.addEventListener('pointerup', (e) => {
  if (!down || !markersOn || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = ray.intersectObjects(K.markers)[0];
  if (hit) select(hit.object.userData.joint);
});

// スマホ幅: パネル → 関節エディタ → 非表示
const panelModes = ['', 'editor', 'collapsed'];
let panelMode = 0;
$('#panel-toggle').addEventListener('click', () => {
  document.body.classList.remove('editor', 'collapsed');
  panelMode = (panelMode + 1) % panelModes.length;
  if (panelModes[panelMode]) document.body.classList.add(panelModes[panelMode]);
  $('#panel-toggle').textContent = ['パネル', '関節', '表示'][panelMode];
});

// ---------- ループ ----------
const clock = new THREE.Clock();
let t = 0;
function simulate(dt) {
  t += dt;
  const v = K.isRiding() ? Number(speedEl.value) : 0; // m/s
  const st = (Number(steerEl.value) * Math.PI) / 180;
  H.setSteer(st);
  H.setLean(-st * Math.min(1, v / 8) * 0.7);
  H.update(dt, v * 2.4);
  K.setWind(v * 0.6);
  grid.position.z = (grid.position.z - v * dt) % 0.25; // 地面の流れで走行感
  K.update(dt, t, camera);
  const sp = sparkGeo.attributes.position.array;
  for (let i = 1; i < sp.length; i += 3) sp[i] = sp[i] > 3.5 ? 0 : sp[i] + dt * 0.08;
  sparkGeo.attributes.position.needsUpdate = true;
}
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (!window.__studio?.paused) simulate(dt);
  const m = K.getMode();
  for (const [k, b] of Object.entries(modeBtns)) b.classList.toggle('on', k === m);
  syncEditor();
  controls.update();
  composer.render();
  requestAnimationFrame(frame);
}
frame();

// テスト・デバッグ用
window.__studio = {
  K, H, camera, controls, bloom, select,
  step: (n, dt = 1 / 60) => { for (let i = 0; i < n; i++) simulate(dt); },
};
  </script>
