<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cyber Knight r128</title>
  <style>html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
  <!-- 組み込み例: three r128(グローバル THREE)+ モデル既定の縮尺(セリナと同じ世界) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="../humanoid-core.js"></script>
  <script src="../cyber-knight-model.js"></script>
  <script src="../cyber-horse-model.js"></script>
  <script src="../cyber-steed-model.js"></script>
  <script>
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1220);
    scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x202030, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(6, 10, 8);
    sun.castShadow = true;
    scene.add(sun);
    // 金属の鎧は周囲を映して色が出るので、環境マップ(グラデーションの空)を用意する
    const sky = document.createElement('canvas');
    sky.width = 256; sky.height = 128;
    const g = sky.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 128);
    grad.addColorStop(0, '#f4f8ff'); grad.addColorStop(0.45, '#9fb4d8'); grad.addColorStop(0.55, '#3a4458'); grad.addColorStop(1, '#151a24');
    g.fillStyle = grad; g.fillRect(0, 0, 256, 128);
    const skyTex = new THREE.CanvasTexture(sky);
    skyTex.mapping = THREE.EquirectangularReflectionMapping;
    skyTex.encoding = THREE.sRGBEncoding;
    scene.environment = new THREE.PMREMGenerator(renderer).fromEquirectangular(skyTex).texture;

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x1a2233 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(5, 4, 9);
    camera.lookAt(0, 2.3, 0);

    const knight = CyberKnightModel.create(THREE, scene, { glowIntensity: 0.35 });
    const horse = CyberHorseModel.create(THREE, scene, { glowIntensity: 0.35 });
    const steed = CyberSteedModel.create(THREE, scene, { glowIntensity: 0.35 });
    horse.root.visible = false;
    steed.root.visible = false;
    // 3 秒ごとにモーションを切り替え、最後はバイクで走り、天馬で飛ぶ
    const modes = ['idle', 'walk', 'guard', 'spin', 'block', 'run', 'charge', 'visor', 'ride', 'steed'];
    let i = -1;
    setInterval(() => {
      const m = modes[++i % modes.length];
      if (knight.isRiding()) { knight.dismount(); horse.root.visible = steed.root.visible = false; horse.setStand(1); }
      if (m === 'ride') { horse.root.visible = true; horse.setStand(0); knight.ride(horse); }
      else if (m === 'steed') { steed.root.visible = true; steed.setMode('fly'); knight.ride(steed); }
      else knight.setMode(m);
    }, 3000);

    const clock = new THREE.Clock();
    let t = 0;
    (function loop() {
      const dt = clock.getDelta();
      t += dt;
      const v = horse.root.visible ? 8 : steed.root.visible ? steed.getSpeed() : 0; // 乗車中は走らせる
      horse.update(dt, v * 2.4);
      horse.setBoost(horse.root.visible ? 0.6 : 0);
      steed.update(dt, t);
      knight.setWind(v * 0.6);
      knight.update(dt, t, camera);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    })();
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
